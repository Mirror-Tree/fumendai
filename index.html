<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五線譜モニター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #E6ECF1;
    --paper: #FFFFFF;
    --ink: #1D2A38;
    --slate: #5B6B7A;
    --line: #C9D3DC;
    --key: #3B6FD8;
    --ghost: #9AA9B8;
    --ok: #2F7D52;
    --ng: #B83A28;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--mist);
    color: var(--ink);
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 上部バー */
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--paper); border-bottom: 1px solid var(--line);
    flex: none;
  }
  .bar h1 { font-size: 1rem; margin: 0; font-weight: 700; white-space: nowrap; }
  .status { color: var(--slate); font-size: .82rem; flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.bad { color: var(--ng); }
  .status.good { color: var(--ok); }

  button, select, input[type=range] { font: inherit; }
  button {
    min-height: 40px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer;
    white-space: nowrap;
  }
  button.primary { background: var(--ink); color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }

  .viewtabs { display: flex; gap: 4px; flex: none; }
  .tab { padding: 6px 10px; min-height: 40px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* 五線譜＋PDFの表示領域 */
  .main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .staffArea { display: flex; flex-direction: column; min-height: 0; }
  .main.mode-staff .staffArea { flex: 1 1 auto; }
  .main.mode-staff .pdfPane { display: none; }
  .main.mode-pdf .staffArea { display: none; }
  .main.mode-pdf .pdfPane { flex: 1 1 auto; display: flex; }
  .main.mode-split .staffArea { flex: 0 0 45%; }
  .main.mode-split .pdfPane { flex: 1 1 auto; display: flex; }

  /* 五線譜 */
  .stage { flex: 1 1 auto; position: relative; min-height: 0; background: var(--paper); }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ghost); pointer-events: none; text-align: center; padding: 0 24px;
  }
  .hint.off { display: none; }

  /* 下部 */
  .foot { flex: none; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 12px; }
  .readout { display: flex; align-items: baseline; gap: 12px; }
  .now { font-size: 1.6rem; font-weight: 700; min-width: 4.5em; font-variant-numeric: tabular-nums; }
  .now.idle { color: var(--line); }
  .nowsub { color: var(--slate); font-size: .85rem; flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pedal { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line);
           color: var(--slate); font-size: .8rem; }
  .pedal.on { background: var(--key); border-color: var(--key); color: #fff; }

  .kb { position: relative; height: 46px; display: none; border: 1px solid var(--ink);
        border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .kb.show { display: flex; }
  .w { flex: 1 1 0; border-right: 1px solid var(--line); background: #fff; position: relative; }
  .w:last-child { border-right: 0; }
  .b { position: absolute; top: 0; height: 62%; background: var(--ink); z-index: 2; }
  .w.on, .b.on { background: var(--key); }

  /* PDF楽譜 */
  .pdfPane { display: none; flex-direction: column; min-height: 0; background: var(--paper); border-top: 1px solid var(--line); }
  .pdfBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px;
            border-bottom: 1px solid var(--line); flex: none; }
  .pdfInfo { font-size: .82rem; color: var(--slate); flex: 1; min-width: 80px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pdfPageLabel { font-size: .85rem; color: var(--slate); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pdfScroll { flex: 1 1 auto; overflow: auto; min-height: 0; background: #77808c;
               display: flex; justify-content: center; }
  .pdfScroll canvas { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); margin: 10px auto; }

  /* 設定 */
  .panel { display: none; padding: 12px; background: var(--paper); border-top: 1px solid var(--line);
           max-height: 46vh; overflow: auto; flex: none; }
  .panel.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 20px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: .82rem; color: var(--slate); }
  select { min-height: 40px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--paper); color: var(--ink); width: 100%; }
  label.chk { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  input[type=checkbox] { width: 20px; height: 20px; }
  input[type=range] { width: 100%; }
  .note { font-size: .78rem; color: var(--slate); margin: 10px 0 0; }
</style>
</head>
<body>

<div class="bar">
  <h1>五線譜モニター</h1>
  <span class="status" id="status">MIDIの使用を許可してください</span>
  <div class="viewtabs" id="viewtabs" role="tablist">
    <button class="tab" data-mode="staff" aria-pressed="true">五線譜</button>
    <button class="tab" data-mode="pdf" aria-pressed="false">PDF</button>
    <button class="tab" data-mode="split" aria-pressed="false">分割</button>
  </div>
  <button class="primary" id="start">MIDI許可</button>
  <button id="toggle" aria-expanded="false">設定</button>
</div>

<div class="main mode-staff" id="main">
  <div class="staffArea">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">鍵盤を弾くと、ここに音符が流れます</div>
    </div>

    <div class="foot">
      <div class="readout">
        <span class="now idle" id="now" aria-live="polite">--</span>
        <span class="nowsub" id="nowsub"></span>
        <span class="pedal" id="pedal">ペダル</span>
      </div>
      <div class="kb show" id="kb" aria-hidden="true"></div>
    </div>
  </div>

  <div class="pdfPane" id="pdfPane">
    <div class="pdfBar">
      <button id="pdfOpenBtn">PDFを開く</button>
      <input type="file" id="pdfFile" accept="application/pdf" hidden>
      <span class="pdfInfo" id="pdfInfo">PDF未選択</span>
      <button id="pdfPrev" disabled>前へ</button>
      <span id="pdfPageLabel">- / -</span>
      <button id="pdfNext" disabled>次へ</button>
      <button id="pdfZoomOut" disabled>縮小</button>
      <button id="pdfZoomIn" disabled>拡大</button>
    </div>
    <div class="pdfScroll" id="pdfScroll">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="grid">
    <label class="fld"><span>MIDI入力</span>
      <select id="inSel"><option value="">検出中…</option></select>
    </label>
    <label class="fld"><span>音名の表示</span>
      <select id="nameMode">
        <option value="en">英語音名（C5）</option>
        <option value="ja">ドレミ</option>
        <option value="both">両方</option>
        <option value="off">表示しない</option>
      </select>
    </label>
    <label class="fld"><span>流れる速さ：<b id="spdVal">10</b> 秒で横断</span>
      <input type="range" id="speed" min="4" max="24" step="1" value="10">
    </label>
    <div class="fld"><span>表示オプション</span>
      <label class="chk"><input type="checkbox" id="enh" checked> 異名同音を併記（♯と♭）</label>
      <label class="chk"><input type="checkbox" id="showKb" checked> 鍵盤を表示</label>
      <label class="chk"><input type="checkbox" id="showLen" checked> 音の長さをバーで表示</label>
      <label class="chk"><input type="checkbox" id="wake"> 画面を消さない</label>
    </div>
  </div>
  <p class="note">設定（音名表示・速さ・異名同音併記・音の長さ表示・鍵盤表示・画面ロック・表示モード）は次回起動時も保持されます。五線から離れすぎた音は 8va / 8vb などの記号を付けて、五線の近くに移動して表示します。PDFは著作権保護のため保存されず、開くたびに端末から選び直します。</p>
</div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";

(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

  /* ---------- 音名・譜表位置の定義 ---------- */
  const N_SHARP  = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const N_FLAT   = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
  const J_SHARP  = ['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
  const J_FLAT   = ['ド','レ♭','レ','ミ♭','ミ','ファ','ソ♭','ソ','ラ♭','ラ','シ♭','シ'];
  const L_SHARP  = [0,0,1,1,2,3,3,4,4,5,5,6];   // ♯表記のときの音名字（C=0…B=6）
  const L_FLAT   = [0,1,1,2,2,3,4,4,5,5,6,6];   // ♭表記のときの音名字
  const IS_BLACK = [0,1,0,1,0,0,1,0,1,0,1,0];
  const LOW = 21, HIGH = 108;                   // 88鍵 A0〜C8

  // ダイアトニック段位（半音ではなく「線と間」の位置、半段単位）
  const stepOf = (n, flat) => (Math.floor(n / 12) - 1) * 7 + (flat ? L_FLAT : L_SHARP)[n % 12];
  const octOf  = n => Math.floor(n / 12) - 1;
  const nameEn = (n, flat) => (flat ? N_FLAT : N_SHARP)[n % 12] + octOf(n);
  const nameJa = (n, flat) => (flat ? J_FLAT : J_SHARP)[n % 12];

  // 大譜表：ト音（E4〜F5）とヘ音（G2〜A3）。中央C(28)はどちらからも加線1本の等距離
  const STAFF = {
    treble: { bottom: 30, top: 38, margin: 11 },
    bass:   { bottom: 18, top: 26, margin: 11 }
  };
  const staffOf = n => n >= 60 ? 'treble' : 'bass';   // 中央C(MIDI60)以上はト音、未満はヘ音

  /* ---------- 状態 ---------- */
  const cfg = { speed: 10, nameMode: 'en', enh: true, showLen: true };
  const notes = [];            // {n, vel, on, off}
  const live  = new Map();     // MIDIノート番号 -> note オブジェクト
  let pedalOn = false, midiAccess = null, wakeLock = null, raf = 0;
  let viewMode = 'staff';

  /* ---------- 設定の永続化 ---------- */
  const SETTINGS_KEY = 'fumendai:index:settings';
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        nameMode: cfg.nameMode,
        speed: cfg.speed,
        enh: cfg.enh,
        showLen: cfg.showLen,
        showKb: $('showKb').checked,
        wake: $('wake').checked,
        viewMode: viewMode
      }));
    } catch (_) {}
  }
  function applySettings(s) {
    if (!s) return;
    if (s.nameMode) { cfg.nameMode = s.nameMode; $('nameMode').value = s.nameMode; }
    if (typeof s.speed === 'number') { cfg.speed = s.speed; $('speed').value = s.speed; $('spdVal').textContent = s.speed; }
    if (typeof s.enh === 'boolean') { cfg.enh = s.enh; $('enh').checked = s.enh; }
    if (typeof s.showLen === 'boolean') { cfg.showLen = s.showLen; $('showLen').checked = s.showLen; }
    if (typeof s.showKb === 'boolean') { $('showKb').checked = s.showKb; $('kb').classList.toggle('show', s.showKb); }
    if (s.wake) { $('wake').checked = true; setWake(true); }
    if (s.viewMode) setViewMode(s.viewMode, true);
  }

  /* ---------- キャンバス ---------- */
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, spacing = 16, staffTopTreble = 0, staffTopBass = 0, clefRight = 0;

  const cssCache = {};
  function getCSS(v) {
    if (!cssCache[v]) cssCache[v] = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    return cssCache[v];
  }

  function layout() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const usable = H - 34;                                  // 下に音名欄を残す
    spacing = Math.max(6, Math.min(20, usable / 26));        // ト音・ヘ音2段分の目安
    const staffH = spacing * 4;                              // 5線＝間隔4つ分
    const gap = spacing * 4;                                 // 段間（中央Cの加線＋余白）
    const totalH = staffH * 2 + gap;
    const top0 = Math.max(0, (usable - totalH) / 2);
    staffTopTreble = top0;
    staffTopBass = top0 + staffH + gap;
    clefRight = Math.round(spacing * 3.2);
    draw();
  }

  const staffTopOf = staff => staff === 'treble' ? staffTopTreble : staffTopBass;
  const yOfStep = (s, staff) => staffTopOf(staff) + 4 * spacing - (s - STAFF[staff].bottom) * spacing / 2;

  // 五線から離れすぎた音はオクターブ単位で寄せる（段ごとに判定）
  function place(step, staff) {
    const s = STAFF[staff];
    let shift = 0;
    while (step > s.top + s.margin) { step -= 7; shift++; }
    while (step < s.bottom - s.margin) { step += 7; shift--; }
    return { step: step, shift: shift };
  }
  const shiftLabel = s => s === 1 ? '8va' : s === 2 ? '15ma' : s === 3 ? '22ma'
                        : s === -1 ? '8vb' : s === -2 ? '15mb' : s === -3 ? '22mb'
                        : s > 0 ? s * 7 + '↑' : s < 0 ? -s * 7 + '↓' : '';

  /* ---------- ト音記号・ヘ音記号 ---------- */
  const clefGlyph = { treble: null, bass: null };  // 𝄞 / 𝄢 が使える環境かを起動時に判定
  function detectGlyph(cp) {
    const t = document.createElement('canvas').getContext('2d');
    t.font = '64px serif';
    const miss = t.measureText('\u{10FFFF}').width;
    const w = t.measureText(cp).width;
    return (w > 0 && Math.abs(w - miss) > 0.5) ? cp : null;
  }
  function detectClef() {
    clefGlyph.treble = detectGlyph('\u{1D11E}');
    clefGlyph.bass = detectGlyph('\u{1D122}');
  }

  function drawClef(staff) {
    const top = staffTopOf(staff);
    const glyph = clefGlyph[staff];
    // ト音は中央線(B4)、ヘ音は第4線(F3)を基準に据える
    const anchorY = staff === 'treble' ? top + 2 * spacing : top + 1 * spacing;
    if (glyph) {
      const size = spacing * 7;
      ctx.font = size + 'px serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const m = ctx.measureText(glyph);
      const asc  = m.actualBoundingBoxAscent  || size * 0.8;
      const desc = m.actualBoundingBoxDescent || size * 0.2;
      const scale = (spacing * 7) / Math.max(1, asc + desc);
      ctx.save();
      ctx.translate(spacing * 0.5, anchorY);
      ctx.scale(scale, scale);
      ctx.fillStyle = getCSS('--ink');
      ctx.fillText(glyph, 0, (asc - desc) / 2);
      ctx.restore();
    } else {
      // 代替表示：ト音(G)・ヘ音(F)の基準線を丸印で示す
      ctx.fillStyle = getCSS('--ink');
      ctx.beginPath();
      ctx.arc(spacing * 1.5, anchorY, spacing * 0.72, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(spacing * 0.95) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(staff === 'treble' ? 'G' : 'F', spacing * 1.5, anchorY + spacing * 0.05);
    }
  }

  /* ---------- 描画 ---------- */
  function drawStaff() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getCSS('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const top of [staffTopTreble, staffTopBass]) {
      for (let i = 0; i < 5; i++) {
        const y = Math.round(top + i * spacing) + 0.5;
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
    }
    ctx.stroke();
    drawClef('treble');
    drawClef('bass');
  }

  function head(x, y, filled, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(-0.34);
    ctx.beginPath();
    ctx.ellipse(0, 0, spacing * 0.66, spacing * 0.46, 0, 0, Math.PI * 2);
    if (filled) { ctx.fillStyle = getCSS('--key'); ctx.fill(); }
    else { ctx.lineWidth = Math.max(1.4, spacing * 0.11); ctx.strokeStyle = getCSS('--key'); ctx.stroke(); }
    ctx.restore();
  }

  function ledgers(x, step, staff) {
    const s = STAFF[staff];
    ctx.strokeStyle = getCSS('--ink');
    ctx.lineWidth = Math.max(1, spacing * 0.09);
    const w = spacing * 1.05;
    ctx.beginPath();
    for (let st = s.top + 2; st <= step; st += 2) { const y = Math.round(yOfStep(st, staff)) + .5; ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); }
    for (let st = s.bottom - 2; st >= step; st -= 2) { const y = Math.round(yOfStep(st, staff)) + .5; ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); }
    ctx.stroke();
  }

  function label(n, flat) {
    const en = nameEn(n, flat), ja = nameJa(n, flat);
    switch (cfg.nameMode) {
      case 'en': return en;
      case 'ja': return ja;
      case 'both': return en + ' ' + ja;
      default: return '';
    }
  }

  function draw() {
    drawStaff();
    const now = performance.now();
    const span = Math.max(40, W - clefRight);
    const pps = span / (cfg.speed * 1000);           // ピクセル毎ミリ秒
    const right = W - spacing * 0.8;
    let lastLabelX = Infinity;

    ctx.save();
    ctx.beginPath();
    ctx.rect(clefRight, 0, W - clefRight, H);
    ctx.clip();

    for (let i = notes.length - 1; i >= 0; i--) {
      const nt = notes[i];
      const x = right - (now - nt.on) * pps;
      const xEnd = nt.off == null ? right : right - (now - nt.off) * pps;
      if (xEnd < clefRight - spacing * 3) { notes.splice(i, 1); continue; }
      if (x > right + spacing) continue;

      const isB = IS_BLACK[nt.n % 12] === 1;
      const both = cfg.enh && isB;
      const staff = staffOf(nt.n);

      // 音の長さのバー
      if (cfg.showLen && xEnd - x > 2) {
        const p = place(stepOf(nt.n, false), staff);
        ctx.save();
        ctx.globalAlpha = .22;
        ctx.fillStyle = getCSS('--key');
        ctx.fillRect(x, yOfStep(p.step, staff) - spacing * 0.2, xEnd - x, spacing * 0.4);
        ctx.restore();
      }

      drawOne(nt, x, false, 1);
      if (both) drawOne(nt, x + spacing * 2.0, true, .45);

      // 音名
      const txt = label(nt.n, false);
      if (txt && x < lastLabelX - spacing * 3.4) {
        ctx.fillStyle = getCSS('--slate');
        ctx.font = Math.round(Math.max(10, spacing * 0.78)) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        const t2 = both ? txt + ' / ' + label(nt.n, true) : txt;
        ctx.fillText(t2, x + (both ? spacing : 0), H - 26);
        lastLabelX = x;
      }
    }
    ctx.restore();
  }

  function drawOne(nt, x, flat, alpha) {
    const staff = staffOf(nt.n);
    const s = STAFF[staff];
    const p = place(stepOf(nt.n, flat), staff);
    const y = yOfStep(p.step, staff);
    if (p.step > s.top + 1 || p.step < s.bottom - 1) {
      ctx.save(); ctx.globalAlpha = alpha; ledgers(x, p.step, staff); ctx.restore();
    }
    head(x, y, nt.off == null, alpha);

    // 臨時記号
    if (IS_BLACK[nt.n % 12]) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = getCSS('--ink');
      ctx.font = Math.round(spacing * 1.5) + 'px serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(flat ? '♭' : '♯', x - spacing * 0.8, y);
      ctx.restore();
    }
    // オクターブ移動の注記
    if (p.shift) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = getCSS('--ng');
      ctx.font = 'bold ' + Math.round(Math.max(9, spacing * 0.7)) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = p.shift > 0 ? 'bottom' : 'top';
      ctx.fillText(shiftLabel(p.shift), x, y + (p.shift > 0 ? -spacing * 0.9 : spacing * 0.9));
      ctx.restore();
    }
  }

  function loop() {
    draw();
    raf = notes.length ? requestAnimationFrame(loop) : 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  /* ---------- 鍵盤 ---------- */
  const keyEls = new Map();
  (function buildKb() {
    const kb = $('kb');
    const whites = [];
    for (let n = LOW; n <= HIGH; n++) if (!IS_BLACK[n % 12]) whites.push(n);
    const ww = 100 / whites.length;
    let wi = 0;
    for (let n = LOW; n <= HIGH; n++) {
      const el = document.createElement('div');
      if (!IS_BLACK[n % 12]) { el.className = 'w'; wi++; }
      else {
        el.className = 'b';
        const bw = ww * 0.62;
        el.style.left = (wi * ww - bw / 2) + '%';
        el.style.width = bw + '%';
      }
      kb.appendChild(el);
      keyEls.set(n, el);
    }
  })();
  const lightKey = (n, on) => { const e = keyEls.get(n); if (e) e.classList.toggle('on', on); };

  /* ---------- MIDI ---------- */
  function setStatus(text, cls) {
    const el = $('status');
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  async function start() {
    if (!('requestMIDIAccess' in navigator)) {
      setStatus('このブラウザはWeb MIDIに対応していません', 'bad');
      return;
    }
    try {
      midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    } catch (e) {
      setStatus(e.name === 'SecurityError'
        ? 'MIDIへのアクセスが拒否されました（HTTPSとサイト設定を確認）'
        : 'MIDIを開始できません（' + e.name + '）', 'bad');
      return;
    }
    $('start').disabled = true;
    midiAccess.onstatechange = refresh;
    refresh();
  }

  function refresh() {
    const ins = [...midiAccess.inputs.values()];
    const sel = $('inSel'), prev = sel.value;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    sel.innerHTML = '<option value="">すべての入力</option>' +
      ins.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name || p.id) + '</option>').join('');
    sel.value = [...sel.options].some(o => o.value === prev) ? prev : '';
    bind();
    const active = ins.filter(p => p.state === 'connected');
    if (active.length) setStatus('接続中：' + active.map(p => p.name || '(名前なし)').join(' / '), 'good');
    else setStatus('MIDI入力が見つかりません。ピアノとの接続を確認してください', 'bad');
  }

  function bind() {
    const pick = $('inSel').value;
    midiAccess.inputs.forEach(inp => {
      inp.onmidimessage = (!pick || inp.id === pick) ? onMidi : null;
    });
  }

  function onMidi(ev) {
    const d = ev.data, st = d[0];
    if (st >= 0xF8) return;                       // Active Sensing 等は無視
    const type = st & 0xF0;
    if (type === 0x90 && d[2] > 0) noteOn(d[1], d[2]);
    else if (type === 0x80 || (type === 0x90 && d[2] === 0)) noteOff(d[1]);
    else if (type === 0xB0 && d[1] === 64) {      // ダンパーは連続値で届くので閾値で判定
      const on = d[2] >= 64;
      if (on !== pedalOn) { pedalOn = on; $('pedal').classList.toggle('on', on); }
    }
  }

  function noteOn(n, vel) {
    if (n < LOW || n > HIGH) return;
    const prev = live.get(n);
    if (prev && prev.off == null) prev.off = performance.now();
    const nt = { n: n, vel: vel, on: performance.now(), off: null };
    notes.push(nt);
    live.set(n, nt);
    lightKey(n, true);
    $('hint').classList.add('off');
    const isB = IS_BLACK[n % 12] === 1;
    $('now').textContent = nameEn(n, false) + (isB ? ' / ' + nameEn(n, true) : '');
    $('now').classList.remove('idle');
    $('nowsub').textContent = nameJa(n, false) + (isB ? ' / ' + nameJa(n, true) : '') + '　強さ ' + vel;
    kick();
  }

  function noteOff(n) {
    const nt = live.get(n);
    if (nt && nt.off == null) nt.off = performance.now();
    live.delete(n);
    lightKey(n, false);
  }

  /* ---------- 画面を消さない ---------- */
  async function setWake(on) {
    try {
      if (on) {
        if (!('wakeLock' in navigator)) { $('wake').checked = false; return; }
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (_) { $('wake').checked = false; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && $('wake').checked && !wakeLock) setWake(true);
  });

  /* ---------- 表示モード（五線譜／PDF／分割） ---------- */
  function setViewMode(mode, skipSave) {
    viewMode = mode;
    $('main').className = 'main mode-' + mode;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    setTimeout(() => {
      layout();
      if (pdfDoc) renderPdfPage();
    }, 0);
    if (!skipSave) saveSettings();
  }

  /* ---------- PDF楽譜 ---------- */
  let pdfDoc = null, pdfPageNum = 1, pdfNumPages = 0, pdfScale = 1.2, pdfRendering = false, pdfPendingPage = false;
  const pdfCanvas = $('pdfCanvas'), pdfCtx = pdfCanvas.getContext('2d');

  async function openPdfFile(file) {
    if (!file) return;
    $('pdfInfo').textContent = '読み込み中…';
    try {
      const buf = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
      pdfNumPages = pdfDoc.numPages;
      pdfPageNum = 1;
      $('pdfInfo').textContent = file.name;
      $('pdfPrev').disabled = false;
      $('pdfNext').disabled = false;
      $('pdfZoomOut').disabled = false;
      $('pdfZoomIn').disabled = false;
      await renderPdfPage();
    } catch (e) {
      pdfDoc = null;
      $('pdfInfo').textContent = 'PDFを開けませんでした（' + e.message + '）';
    }
  }

  async function renderPdfPage() {
    if (!pdfDoc) return;
    if (pdfRendering) { pdfPendingPage = true; return; }
    pdfRendering = true;
    try {
      const page = await pdfDoc.getPage(pdfPageNum);
      const viewport = page.getViewport({ scale: pdfScale });
      pdfCanvas.width = viewport.width;
      pdfCanvas.height = viewport.height;
      await page.render({ canvasContext: pdfCtx, viewport: viewport }).promise;
      $('pdfPageLabel').textContent = pdfPageNum + ' / ' + pdfNumPages;
    } catch (_) {
      // 描画中のページ切替などは無視（次のレンダリングが上書きする）
    } finally {
      pdfRendering = false;
      if (pdfPendingPage) { pdfPendingPage = false; renderPdfPage(); }
    }
  }

  function pdfGoPage(delta) {
    if (!pdfDoc) return;
    const n = Math.min(pdfNumPages, Math.max(1, pdfPageNum + delta));
    if (n !== pdfPageNum) { pdfPageNum = n; renderPdfPage(); }
  }
  function pdfZoom(delta) {
    if (!pdfDoc) return;
    pdfScale = Math.min(3, Math.max(0.5, Math.round((pdfScale + delta) * 10) / 10));
    renderPdfPage();
  }

  /* ---------- 初期化 ---------- */
  detectClef();
  layout();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(cv);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));

  $('start').addEventListener('click', start);
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setViewMode(b.dataset.mode)));
  $('toggle').addEventListener('click', () => {
    const open = $('panel').classList.toggle('show');
    $('toggle').setAttribute('aria-expanded', String(open));
    setTimeout(layout, 0);
  });
  $('inSel').addEventListener('change', bind);
  $('nameMode').addEventListener('change', e => { cfg.nameMode = e.target.value; draw(); saveSettings(); });
  $('speed').addEventListener('input', e => { cfg.speed = +e.target.value; $('spdVal').textContent = e.target.value; draw(); saveSettings(); });
  $('enh').addEventListener('change', e => { cfg.enh = e.target.checked; draw(); saveSettings(); });
  $('showLen').addEventListener('change', e => { cfg.showLen = e.target.checked; draw(); saveSettings(); });
  $('showKb').addEventListener('change', e => { $('kb').classList.toggle('show', e.target.checked); setTimeout(layout, 0); saveSettings(); });
  $('wake').addEventListener('change', e => { setWake(e.target.checked); saveSettings(); });

  $('pdfOpenBtn').addEventListener('click', () => $('pdfFile').click());
  $('pdfFile').addEventListener('change', e => openPdfFile(e.target.files[0]));
  $('pdfPrev').addEventListener('click', () => pdfGoPage(-1));
  $('pdfNext').addEventListener('click', () => pdfGoPage(1));
  $('pdfZoomOut').addEventListener('click', () => pdfZoom(-0.2));
  $('pdfZoomIn').addEventListener('click', () => pdfZoom(0.2));

  applySettings(loadSettings());

  // 動作確認用（コンソールから呼べる。実機のMIDIなしで描画を確認するため）
  window.__place = (step, staff) => place(step, staff || 'treble');
  window.__stepOf = stepOf;
  window.__staffOf = staffOf;
  window.__noteOn = noteOn;
  window.__noteOff = noteOff;
})();
</script>
</body>
</html>
